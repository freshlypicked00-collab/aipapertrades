<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <!-- Dark background -->
    <rect width="1024" height="1024" fill="#0b0b0a"/>

    <!-- LAYERED GLOW: Ultra-compatible layered strokes to ensure perfect rendering across all platforms -->
    <!-- Glow Layer 1: Widest, softest -->
    <g stroke="#3ddc84" stroke-linejoin="round" stroke-linecap="round" fill="none">
        <path d="M150,710 L410,450 L570,610 L800,380" stroke-width="140" opacity="0.05"/>
        <polygon points="50,0 -40,-60 -20,0 -40,60" transform="translate(820,360) rotate(-45)" stroke-width="140" opacity="0.05" fill="#3ddc84"/>
    </g>

    <!-- Glow Layer 2: Mid-spread -->
    <g stroke="#3ddc84" stroke-linejoin="round" stroke-linecap="round" fill="none">
        <path d="M150,710 L410,450 L570,610 L800,380" stroke-width="90" opacity="0.15"/>
        <polygon points="50,0 -40,-60 -20,0 -40,60" transform="translate(820,360) rotate(-45)" stroke-width="90" opacity="0.15" fill="#3ddc84"/>
    </g>

    <!-- Glow Layer 3: Tight aura -->
    <g stroke="#3ddc84" stroke-linejoin="round" stroke-linecap="round" fill="none">
        <path d="M150,710 L410,450 L570,610 L800,380" stroke-width="60" opacity="0.3"/>
        <polygon points="50,0 -40,-60 -20,0 -40,60" transform="translate(820,360) rotate(-45)" stroke-width="60" opacity="0.3" fill="#3ddc84"/>
    </g>

    <!-- Core Solid Line and Arrow -->
    <g stroke="#3ddc84" stroke-linejoin="round" stroke-linecap="round" fill="none">
        <path d="M150,710 L410,450 L570,610 L800,380" stroke-width="50"/>
        <polygon points="50,0 -40,-60 -20,0 -40,60" transform="translate(820,360) rotate(-45)" stroke-width="12" fill="#3ddc84"/>
    </g>

    <!-- ROBOTS: Positioned to nest perfectly under the line, safe inside r=440 circle -->
    <!-- Robot 1: Claude (Orange) -->
    <g id="robot-claude" transform="translate(290, 710) scale(1)">
        <line x1="0" y1="-118.0" x2="0" y2="-162.0" stroke="#f2e9d8" stroke-width="10.00" stroke-linecap="round"/>
        <circle cx="0" cy="-178.0" r="22.00" fill="#ffcb66" stroke="#14120e" stroke-width="7.00"/>
        <rect x="-95.0" y="-120.0" width="190.0" height="200.0" rx="46.0" fill="#d97757" stroke="#14120e" stroke-width="11.00"/>
        <circle cx="-38.0" cy="-40.0" r="20.00" fill="#14120e"/>
        <circle cx="-39.0" cy="-47.0" r="5.50" fill="#f2e9d8"/>
        <circle cx="38.0" cy="-40.0" r="20.00" fill="#14120e"/>
        <circle cx="37.0" cy="-47.0" r="5.50" fill="#f2e9d8"/>
        <polyline points="-35.0,25.0 0,45.0 35.0,25.0" fill="none" stroke="#14120e" stroke-width="10.00" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Robot 2: Gemini (Blue) -->
    <g id="robot-gemini" transform="translate(512, 710) scale(1)">
        <line x1="0" y1="-118.0" x2="0" y2="-162.0" stroke="#f2e9d8" stroke-width="10.00" stroke-linecap="round"/>
        <circle cx="0" cy="-178.0" r="22.00" fill="#ffcb66" stroke="#14120e" stroke-width="7.00"/>
        <rect x="-95.0" y="-120.0" width="190.0" height="200.0" rx="46.0" fill="#4f8ff7" stroke="#14120e" stroke-width="11.00"/>
        <circle cx="-38.0" cy="-40.0" r="20.00" fill="#14120e"/>
        <circle cx="-39.0" cy="-47.0" r="5.50" fill="#f2e9d8"/>
        <circle cx="38.0" cy="-40.0" r="20.00" fill="#14120e"/>
        <circle cx="37.0" cy="-47.0" r="5.50" fill="#f2e9d8"/>
        <polyline points="-35.0,25.0 0,45.0 35.0,25.0" fill="none" stroke="#14120e" stroke-width="10.00" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Robot 3: ChatGPT (White) -->
    <g id="robot-chatgpt" transform="translate(734, 710) scale(1)">
        <line x1="0" y1="-118.0" x2="0" y2="-162.0" stroke="#f2e9d8" stroke-width="10.00" stroke-linecap="round"/>
        <circle cx="0" cy="-178.0" r="22.00" fill="#ffcb66" stroke="#14120e" stroke-width="7.00"/>
        <rect x="-95.0" y="-120.0" width="190.0" height="200.0" rx="46.0" fill="#f2f2f2" stroke="#14120e" stroke-width="11.00"/>
        <circle cx="-38.0" cy="-40.0" r="20.00" fill="#14120e"/>
        <circle cx="-39.0" cy="-47.0" r="5.50" fill="#f2e9d8"/>
        <circle cx="38.0" cy="-40.0" r="20.00" fill="#14120e"/>
        <circle cx="37.0" cy="-47.0" r="5.50" fill="#f2e9d8"/>
        <polyline points="-35.0,25.0 0,45.0 35.0,25.0" fill="none" stroke="#14120e" stroke-width="10.00" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</svg>