name: Post one video to X and Telegram (ops/video_post.json)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rivals
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Post
        run: python3 ops/video_post.py
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add ops/src/x_sent.json ops/src/tg_video_sent.json 2>/dev/null && git commit -qm "Video posted to X and Telegram" && (git push -q origin HEAD:main || (git pull --rebase -q && git push -q origin HEAD:main)) || true
