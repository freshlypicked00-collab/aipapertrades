name: Voiceover for a Short (Gemini TTS, Kokoro fallback)
# Owner, Nov 3: YouTube-first Shorts with a voice. Makes the voice lines of one script (ops/voice/<name>.json) and commits
# them to social/voice/<name>/<engine>/ (ops/voice.py). Posts nothing.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'the script file, e.g. ops/voice/options-g-opt.json'
        required: true
      model:
        description: 'optional: a Gemini TTS model name to try first (empty = the newest)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: voice
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KOKORO_DIR: /tmp/kokoro
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Kokoro (open-source voice, the fallback)
        continue-on-error: true
        run: |
          pip install -q kokoro-onnx soundfile numpy >/dev/null 2>&1 || pip install kokoro-onnx soundfile numpy
          mkdir -p /tmp/kokoro && cd /tmp/kokoro
          curl -sSLf -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSLf -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la /tmp/kokoro
      - name: Word timings and a check of what was said (faster-whisper, open source)
        continue-on-error: true
        run: pip install -q faster-whisper >/dev/null 2>&1 || pip install faster-whisper
      - name: Make the voice lines
        env:
          TTS_MODEL: ${{ inputs.model }}
        run: python3 ops/voice.py "${{ inputs.script }}"
      - name: Save them
        run: |
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add social/voice && git commit -qm "Voiceover lines: ${{ inputs.script }}" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i * 5)); done
