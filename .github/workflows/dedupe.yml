name: Repeated posts (list, or remove with the owner's OK)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'dry = only list the repeated posts; delete = keep the first copy of each and delete the later copies (cannot be undone)'
        default: dry
        type: choice
        options: [dry, delete]
      hours:
        description: 'how many hours back to look'
        default: '30'
permissions:
  contents: read
jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Repeated result posts on Telegram and Discord
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
          HOURS: ${{ inputs.hours }}
        run: python3 -u ops/dedupe_posts.py
