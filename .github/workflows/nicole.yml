name: Email Nicole a manual-post task
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'task file in ops/nicole, e.g. 2026-11-01-allin-story.md'
        required: true
permissions:
  contents: write
  issues: write
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Comment on the Tasks for Nicole issue (GitHub emails it to her)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ inputs.file }}
        run: |
          python3 ops/nicole.py "ops/nicole/$FILE"
      - name: Also send it to Nicole's Telegram task bot (one message per job, each with a Done button)
        env:
          NICOLE_BOT_TOKEN: ${{ secrets.NICOLE_BOT_TOKEN }}
          FILE: ${{ inputs.file }}
        run: |
          python3 ops/nicole_bot.py poll || true
          python3 ops/nicole_bot.py send "ops/nicole/$FILE" || true
      - name: Save what was sent
        env:
          FILE: ${{ inputs.file }}
        run: |
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          python3 ops/nicole_bot.py save "Nicole: task sent ($FILE)"
