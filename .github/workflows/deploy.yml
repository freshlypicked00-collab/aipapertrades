name: Publish the site
# Replaces GitHub's automatic "pages build and deployment" (one build per push) to save Actions minutes (Oct 30):
#  - pushes that only change ops/ (data the site build reads, never served) do not publish;
#  - while one publish is running, newer ones wait and only the newest of them runs (a burst of pushes = 2 publishes, not 10).
# Bots that push with the workflow token (which never triggers push workflows) start this with `gh workflow run deploy.yml`.
on:
  push:
    branches: [main]
    paths-ignore: ['ops/**', '.github/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
  issues: write   # the price guard opens a "Price hold" issue for Claude
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always publish the newest commit, even when this run was queued behind another
          fetch-depth: 2   # the IndexNow step compares with the previous commit
      - name: Price guard (Claude's new prices vs the feeds before publishing; owner's idea, all three AIs agreed, Oct 30)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 ops/price_guard.py; then
            for n in $(gh issue list --label price-hold --state open --json number --jq '.[].number' 2>/dev/null); do gh issue close "$n" -c "Prices check out now; published." || true; done
          else
            if [ -z "$(gh issue list --label price-hold --state open --json number --jq '.[].number' 2>/dev/null)" ]; then
              gh label create price-hold --color B60205 --description "A Claude price is held before publishing" 2>/dev/null || true
              { echo "The price guard held this publish: a price Claude wrote is outside the feed's range at the time Claude stated."; echo; echo '```json'; cat /tmp/price_hold.json; echo '```'; echo; echo "Claude: re-check each price above and run update.py with the right one (RUNBOOK, Price hold). The hold lifts by itself at the 'until' time; the hourly price check then flags it."; } > /tmp/body.md
              gh issue create --title "Price hold: a Claude price is being re-checked" --label price-hold --body-file /tmp/body.md || true
            fi
            exit 1
          fi
      - name: Only the site's own files (the code, runbook, internal state and reviews in ops/ stay private; owner, Oct 30)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'ops' --exclude '_site' ./ _site/
          test -f _site/index.html && test -f _site/data.json && test -f _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow (owner Nov 1; all three AIs agreed: ops/review/name-mixup-nov1.json): tells Bing (which feeds ChatGPT search, Copilot and
      # DuckDuckGo), Yandex and others that pages changed. Pings the static pages when they change, and the home page once a day.
      # Never fails the publish.
      - name: IndexNow ping
        if: success()
        continue-on-error: true
        run: |
          KEY=3bd4b084ff19a869046b8421c54136a4
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- about.html what-is-papertrades-ai.html llms.txt sitemap.xml 2>/dev/null | sed 's#^#https://papertrades.ai/#')
          URLS="$CHANGED"
          if [ -n "$CHANGED" ] || [ "$(date -u +%H)" = "15" ]; then URLS="https://papertrades.ai/
          $URLS"; fi
          URLS=$(echo "$URLS" | sed 's/^ *//' | grep -v '^$' | sort -u)
          [ -z "$URLS" ] && { echo "nothing to ping"; exit 0; }
          LIST=$(echo "$URLS" | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"papertrades.ai\",\"key\":\"$KEY\",\"keyLocation\":\"https://papertrades.ai/$KEY.txt\",\"urlList\":$LIST}"
      # Discord #holdings (owner, Nov 13): the bot edits its three messages (one per AI) with what each holds now. Never fails the publish.
      - name: Discord holdings
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          pip install -q pillow 2>/dev/null || true
          python3 ops/discord_holdings.py
