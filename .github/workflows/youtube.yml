name: YouTube Shorts (through Metricool)
on:
  schedule:
    # ONE story Short a day (owner, Oct 31: the replays were slop; standard S1-S10 agreed by all three AIs, S8 = one a day):
    # about 12:30 p.m. ET, after the night's games have settled (11:30 a.m. ET after Nov 1, when clocks go back)
    - cron: '32 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'story = the day''s biggest settled bet as a story Short (public; one a day); probe = check the token (posts nothing); test = an UNLISTED test upload; daily = the OLD replay (retired)'
        type: choice
        options: [story, probe, test, daily]
        default: story
      tx:
        description: 'story only: a result transaction ID to tell (e.g. G-AIS-017); empty = the biggest of the last 36 hours'
        required: false
        default: ''
permissions:
  contents: write
  actions: write   # to publish the site (deploy.yml) after adding the video
concurrency:
  group: youtube
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check the Metricool token and the YouTube connection (posts nothing)
        if: ${{ inputs.mode == 'probe' }}
        run: |
          python3 ops/metricool.py probe
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add ops/review/metricool-probe.json && git commit -qm "Metricool probe: token and YouTube connection (no posting)" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done || true
      - name: Safety test - one existing Short, UNLISTED (not on the channel, no notification)
        if: ${{ inputs.mode == 'test' }}
        run: |
          python3 ops/metricool.py test
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add ops/review/metricool-test.json && git commit -qm "Metricool safety test: one unlisted YouTube Short" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done || true
      - name: Today's story Short - make it and post it (public, one a day)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'story' }}
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q pillow numpy >/dev/null 2>&1 || true
          python3 ops/metricool.py story "${{ inputs.tx }}"
      - name: The old race replay (retired, manual only)
        if: ${{ inputs.mode == 'daily' }}
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q pillow numpy >/dev/null 2>&1 || true
          python3 ops/metricool.py daily
