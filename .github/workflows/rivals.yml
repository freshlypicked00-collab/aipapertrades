name: Head to head (Gemini and ChatGPT)
on:
  schedule:
    # Same moments as Claude's runs (times in UTC; GitHub may start them a few minutes late)
    - cron: '13 * * * *'          # hourly, like Claude's hourly run
    # the settle watcher: bets on finished games settle within about 15 minutes, not at the next hourly check-in (owner, Oct 29).
    # 7 p.m. to 3 a.m. ET every day, and weekend afternoons; no model is called, and it stops at once when no game can have ended.
    - cron: '3,18,33,48 0-6,23 * * *'
    - cron: '3,18,33,48 16-22 * * 0,6'
    - cron: '43 13-20 * * 1-5'    # half-hour runs during US market hours (EDT and EST)
    - cron: '8,23,38,53 13-21 * * 1-5'   # stops and targets only, every 15 minutes in US market hours (no model call; rivals.py STOPS_CRON)
    - cron: '35 13,14 * * 1-5'    # US open, 9:35 a.m. ET (EDT / EST)
    - cron: '5 20,21 * * 1-5'     # US close, 4:05 p.m. ET (EDT / EST)
    - cron: '35 1 * * 1-5'        # Shanghai open, 9:35 a.m. Beijing
    - cron: '5 7 * * 1-5'         # Shanghai close, 3:05 p.m. Beijing
    # Oct 28 event runs, matching Claude's extra runs (Bank of Canada, Fed, Microsoft/Alphabet earnings)
    - cron: '50 13 28 10 *'
    - cron: '5 18 28 10 *'
    - cron: '25 20 28 10 *'
    # (The 15-minute event watcher was removed on Oct 28 to save Actions minutes once the repo is private:
    #  Claude's extra event runs now dispatch this workflow themselves; the hourly :13 run is the fallback.)
    # Final scoring, Sat Nov 28 at 4:01 p.m. ET: freezes Gemini's and ChatGPT's final values (later runs only settle bets)
    - cron: '1 21 28 11 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = a normal check-in (skipped if one ran in the last 10 minutes); force = check in even so; prices = only test the price feeds; ask = feedback or review, no trading; fill = fill Claude''s queued orders and check every AI''s stops (no rival check-in)'
        default: run
        type: choice
        options: [run, force, prices, ask, fill]
      name:
        description: 'ask mode only: name of the answers file in ops/review'
        default: answers
        required: false
      only:
        description: 'ask mode only: ask just these AIs (gemini, chatgpt); empty = both'
        default: ''
        required: false
permissions:
  contents: write
  pages: write
  issues: write
  actions: write   # to start deploy.yml after pushing
concurrency:
  group: rivals
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest data: a queued run must not start from the commit it was triggered on
      - name: Append-only check of the past record (root-cause vote R5, Oct 31; reports only, never changes the record)
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: python3 ops/appendonly.py
      - name: Test price feeds
        if: ${{ inputs.mode == 'prices' }}
        run: python3 ops/rivals.py --prices
      - name: Ask Gemini and ChatGPT for feedback (no trading)
        if: ${{ inputs.mode == 'ask' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ASK_NAME: ${{ inputs.name }}
          ASK_ONLY: ${{ inputs.only }}
        continue-on-error: true
        run: python3 ops/ask_rivals.py
      - name: Save the answers (ops/review)
        if: ${{ inputs.mode == 'ask' }}
        run: |
          [ -d ops/review ] || exit 0
          mkdir -p /tmp/review && cp ops/review/*.json /tmp/review/ 2>/dev/null || exit 0
          git config user.name "paper-trades-bot"
          git config user.email "paper-trades-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p ops/review && cp /tmp/review/*.json ops/review/
            git add ops/review
            git diff --cached --quiet && exit 0
            git commit -qm "Ask Gemini and ChatGPT: answers saved in ops/review (no trading)"
            git push -q origin HEAD:main && break
            sleep $((i * 7))
          done
      # Nov 19: the runner image changed to ubuntu-26.04 (between Nov 10 and Nov 16) and no longer ships ffmpeg, so every animated card
      # (owner, Nov 1) has gone out as a still picture since. Installing ffmpeg again was tried for half an hour on Nov 19 and taken
      # back: a test showed the animation is an almost EMPTY card with today's Pillow (only the @PaperTradesAI mark), and that must
      # never reach the channels. Animated cards are now off in ops/animate.py (PT_GIFS=1 turns them on) until the recorder is repaired
      # and proven with pictures (ops/review/NIGHT_PASS_REPORT.md).
      - run: pip install -q matplotlib
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' && !startsWith(github.event.schedule, '3,18,33,48') }}
      - name: "Tests of the race code (root-cause vote R7, Oct 31); a failure stops this run and opens an alert"
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 ops/tests/run_tests.py > /tmp/tests.log 2>&1; then
            cat /tmp/tests.log
            if [ -z "$(gh issue list --label tests-failing --state open --json number --jq '.[].number' 2>/dev/null)" ]; then
              gh label create tests-failing --color B60205 --description "Race code tests failing; runs are stopped" 2>/dev/null || true
              { echo "The race code's tests failed, so this run (and every run until they pass) did not trade, fill or publish. Gemini, ChatGPT and Claude are stopped equally."; echo; echo '```'; tail -60 /tmp/tests.log; echo '```'; } > /tmp/body.md
              gh issue create --title "Race stopped: code tests failing" --label tests-failing --body-file /tmp/body.md || true
            fi
            exit 1
          fi
          tail -1 /tmp/tests.log
          for n in $(gh issue list --label tests-failing --state open --json number --jq '.[].number' 2>/dev/null); do gh issue close "$n" -c "Tests pass again; runs resumed." || true; done
      - name: Let each rival model decide and trade
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_DAILY: ${{ secrets.DISCORD_WEBHOOK_DAILY }}
          DISCORD_WEBHOOK_LEADS: ${{ secrets.DISCORD_WEBHOOK_LEADS }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python3 -u ops/rivals.py   # -u: the log shows each line at once, so a run that is stopped still says where it was (Nov 19)
      - name: Check Claude's prices against the same feeds (ops/price_audit.py)
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' && !startsWith(github.event.schedule, '3,18,33,48') && github.event.schedule != '8,23,38,53 13-21 * * 1-5' }}
        continue-on-error: true
        timeout-minutes: 8
        env:   # Gemini and ChatGPT check each flagged price as a backup (owner, Oct 30)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python3 ops/price_audit.py
      - name: Long price history for every holding (ops/px_long.py; the site's 30-day to 5-year holding charts)
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' && !startsWith(github.event.schedule, '3,18,33,48') && github.event.schedule != '8,23,38,53 13-21 * * 1-5' }}
        continue-on-error: true
        timeout-minutes: 4
        run: python3 ops/px_long.py
      - name: What happened next (ops/after.py; the latest price of everything sold in the last 31 days, shown under each sale)
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python3 ops/after.py
      - name: Publish
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_DAILY: ${{ secrets.DISCORD_WEBHOOK_DAILY }}
          DISCORD_WEBHOOK_LEADS: ${{ secrets.DISCORD_WEBHOOK_LEADS }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          [ -f ops/src/rivals.json ] || exit 0
          # nothing to publish when this run skipped or changed nothing: never push an old copy over newer data
          if git diff --quiet -- ops/src/rivals.json && [ -z "$(git status --porcelain -- ops/src/price_audit.json ops/src/px_long.json ops/src/after.json)" ] && [ ! -f /tmp/claude_fill_batch.json ]; then echo "nothing changed; nothing to publish"; exit 0; fi
          cp ops/src/rivals.json /tmp/rivals.json
          [ -f ops/src/price_audit.json ] && cp ops/src/price_audit.json /tmp/price_audit.json
          [ -f ops/src/px_long.json ] && cp ops/src/px_long.json /tmp/px_long.json
          [ -f ops/src/after.json ] && cp ops/src/after.json /tmp/after.json
          [ -f ops/archive/thoughts.jsonl ] && cp ops/archive/thoughts.jsonl /tmp/thoughts.jsonl
          [ -f ops/src/integrity.json ] && cp ops/src/integrity.json /tmp/integrity.json
          git config user.name "paper-trades-bot"
          git config user.email "paper-trades-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/rivals.json ops/src/rivals.json
            [ -f /tmp/price_audit.json ] && cp /tmp/price_audit.json ops/src/price_audit.json
            [ -f /tmp/px_long.json ] && cp /tmp/px_long.json ops/src/px_long.json
            [ -f /tmp/after.json ] && cp /tmp/after.json ops/src/after.json
            [ -f /tmp/integrity.json ] && cp /tmp/integrity.json ops/src/integrity.json
            if [ -f /tmp/thoughts.jsonl ]; then mkdir -p ops/archive && cp /tmp/thoughts.jsonl ops/archive/thoughts.jsonl; fi
            # option B: Claude's fills go onto the LATEST ops/src (anything Claude pushed meanwhile is kept); one that no longer fits is refused
            if [ -f /tmp/claude_fill_batch.json ]; then python3 ops/claude_fill.py apply /tmp/claude_fill_batch.json; fi
            # R3: Claude's automatic price corrections, also on the LATEST ops/src (root-cause vote, Oct 31)
            if grep -q '"pending_claude": true' ops/src/rivals.json; then python3 ops/fillcheck.py apply-claude && git add ops/src/holdings.json ops/src/history.json ops/src/log.json; fi
            python3 ops/build_site.py ops/src .
            python3 ops/discord_leads.py pick || true   # new lead changes for Discord #lead-changes, posted after the push
            git add ops/src/rivals.json index.html data.json data.ver audit.json og.png ops/src/og.json data
            [ -d searchlog ] && git add searchlog   # the search source ledger's public day files (all three AIs agreed, Oct 30)
            [ -f ops/src/discord_sent.json ] && git add ops/src/discord_sent.json
            [ -f ops/src/x_sent.json ] && git add ops/src/x_sent.json   # what went to X (no repeats, the daily cap)
            [ -f ops/src/price_audit.json ] && git add ops/src/price_audit.json
            [ -f ops/src/px_long.json ] && git add ops/src/px_long.json px_long.json
            [ -f ops/src/after.json ] && git add ops/src/after.json
            [ -f ops/src/integrity.json ] && git add ops/src/integrity.json
            [ -f ops/archive/thoughts.jsonl ] && git add ops/archive/thoughts.jsonl
            [ -f /tmp/claude_fill_batch.json ] && git add ops/src
            git diff --cached --quiet && exit 0
            if [ "${{ inputs.mode }}" = fill ]; then msg="Claude's queued orders filled by the race runner (option B)"; else msg="Head to head: hourly Gemini and ChatGPT run"; fi
            git commit -qm "$msg"
            if git push -q origin HEAD:main; then pushed=1; break; fi
            sleep $((i * 7))
          done
          [ "${pushed:-0}" = 1 ] || { echo "could not push after 5 tries"; exit 1; }
          [ -f /tmp/claude_fill_posts.json ] && python3 ops/claude_fill.py post /tmp/claude_fill_posts.json || true
          python3 ops/discord_leads.py post || true
          if [ -n "$(git status --porcelain -- ops/src/x_sent.json)" ]; then git add ops/src/x_sent.json && git commit -qm "X: lead changes posted" && (git push -q origin HEAD:main || (git pull --rebase -q && git push -q origin HEAD:main)) || true; fi
          gh workflow run deploy.yml -R ${{ github.repository }} --ref main >/dev/null || true   # publish the site (deploy.yml)
      - name: Instagram (moments and the daily race post; does nothing until the key is set)
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: bash ops/social.sh
      - name: Health check (opens a GitHub issue, which emails the owner, when something keeps failing)
        if: ${{ always() && inputs.mode != 'prices' && inputs.mode != 'ask' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          : > /tmp/alert.txt
          python3 - >> /tmp/alert.txt <<'PY' || true
          import json, os, sys
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          s = json.load(open('ops/src/rivals.json'))
          for mid, m in s.get('models', {}).items():
              lr = m.get('last_run') or {}; txt = ' '.join(map(str, lr.get('notes') or [])) + ' ' + str(lr.get('status', ''))
              if str(lr.get('status', '')).startswith('error') and any(w in txt.lower() for w in ('402', 'credit', 'quota', 'insufficient', 'billing', 'resource_exhausted')):
                  # out of API credit: alert on the FIRST failed check-in, not after three (Gemini ran dry on Nov 1, owner), and keep saying so
                  print(f"- {m.get('label', mid)} is OUT OF API CREDIT: {max(1, m.get('fail_streak', 0))} check-in(s) in a row failed, the latest at {lr.get('at', '')[:16]} UTC. Top up now ({'Google AI Studio: https://ai.studio/projects' if mid == 'gemini' else 'OpenRouter: https://openrouter.ai/settings/credits'}). Every hour without credit is a missed check-in, and a day without one costs its betting minimums.")
              elif m.get('fail_streak', 0) >= 3:
                  print(f"- {m.get('label', mid)}: the last {m['fail_streak']} check-ins failed. Last error: {lr.get('status', '')}")
          end = datetime(2026, 11, 28, 21, 0, tzinfo=timezone.utc)
          # Nov 18: warn BEFORE ChatGPT runs dry (it ran out of OpenRouter credit on Nov 3, Nov 12 and Nov 16). Reading the balance is free.
          try:
              import urllib.request
              if os.environ.get('OPENROUTER_API_KEY') and now < end:
                  def orq(p):
                      rq = urllib.request.Request('https://openrouter.ai/api/v1/' + p, headers={'Authorization': 'Bearer ' + os.environ['OPENROUTER_API_KEY']})
                      return json.load(urllib.request.urlopen(rq, timeout=20)).get('data') or {}
                  c, kd = orq('credits'), orq('key')
                  left = float(c.get('total_credits') or 0) - float(c.get('total_usage') or 0)
                  wk0 = (now - timedelta(days=now.weekday())).replace(hour=0, minute=0, second=0, microsecond=0)
                  mo0 = now.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
                  days_wk, days_mo = (now - wk0).total_seconds() / 86400, (now - mo0).total_seconds() / 86400
                  # the higher of this week's and this month's daily spend: a week spent out of credit must not make the pace look slow
                  pace = max(float(kd.get('usage_weekly') or 0) / max(1.0, days_wk), float(kd.get('usage_monthly') or 0) / max(1.0, days_mo))
                  if left < 15:
                      print(f"- ChatGPT: OpenRouter credit is down to US${left:.2f}" + (f", about {left / pace:.1f} days at the recent pace of US${pace:.2f} a day" if pace > 0.5 else '') + ". Top up before it runs out: https://openrouter.ai/settings/credits"
                            + (". That is too little for even one check-in: each call needs about US$2 of room." if left < 2 else ''))
                  lim = kd.get('limit_remaining')
                  if lim is not None and float(lim) < 15:
                      print(f"- ChatGPT: the OpenRouter key's monthly cap is almost used: US${float(lim):.2f} left of US${float(kd.get('limit') or 0):.0f} until it resets on the 1st. Raise the key's limit on openrouter.ai (the Keys page).")
          except Exception as e:
              print(f'(could not read the OpenRouter balance: {str(e)[:160]})', file=sys.stderr)
          try:
              h = json.load(open('ops/src/history.json'))
              last = max(datetime.fromisoformat(x['at'].replace('Z', '+00:00')) for x in h)
              if now < end and now - last > timedelta(hours=3):
                  print(f"- Claude: no update for {int((now - last).total_seconds() // 3600)} hours (last {last.isoformat()}). Its scheduled tasks may be paused or failing.")
          except Exception as e:
              print(f'- could not read Claude history: {e}')
          # serious problems only (owner's rule, Oct 29): failed public posts, cap breaches, duplicate trades
          tg = s.get('telegram') or {}
          if tg.get('fail_streak', 0) >= 3:
              print(f"- Telegram: the last {tg['fail_streak']} posts failed ({tg.get('error', '')[:120]}). Check the bot token and that the bot is still an admin of the channel.")
          try:   # Instagram posts failing for 2+ hours (usually the access token needs renewing)
              ig = json.load(open('ops/src/social.json')).get('errors') or {}
              if ig.get('since') and now - datetime.fromisoformat(ig['since']) > timedelta(hours=2):
                  print(f"- Instagram: posts have failed since {ig['since'][:16]} UTC: {ig.get('msg', '')[:160]}. Usually the access token needs renewing: make a new long-lived token for the Paper Trades app and update the INSTAGRAM_ACCESS_TOKEN secret.")
          except Exception:
              pass
          try:   # Claude's holdings over a cap (checked from Oct 29 10:30 a.m. ET, after the SGOV fix at the US open)
              if now >= datetime(2026, 10, 29, 14, 30, tzinfo=timezone.utc):
                  hold = json.load(open('ops/src/holdings.json'))
                  CAP = {'Safe': 0.5, 'Stocks': 0.5, 'Crypto': 0.5, 'China': 0.5, 'Metals': 0.5, 'Energy': 0.5, 'Options': 0.5, 'Predictions': 0.25}
                  tot = {}
                  for x in hold:
                      tot[x['portfolio']] = tot.get(x['portfolio'], 0) + float(x.get('value_cad') or x.get('value_usd') or 0)
                  for x in hold:
                      pf, v = x['portfolio'], float(x.get('value_cad') or x.get('value_usd') or 0)
                      if pf in CAP and not str(x['holding']).startswith('Cash') and tot.get(pf) and v / tot[pf] > CAP[pf] + 0.05:
                          print(f"- Claude: {x['holding']} is {v / tot[pf]:.0%} of {pf}, over the {CAP[pf]:.0%} cap.")
          except Exception as e:
              print(f'- could not check caps: {e}')
          try:   # the same trade recorded twice within 2 minutes
              seen = {}
              for t in s.get('trades', [])[-300:]:
                  k = (t.get('model'), t.get('experiment'), t.get('action'), t.get('symbol'), round(float(t.get('amount') or 0), 2))
                  at = datetime.fromisoformat(t['at'].replace('Z', '+00:00'))
                  if k in seen and abs((at - seen[k]).total_seconds()) <= 120 and t.get('action') in ('Buy', 'Sell', 'Short', 'Cover', 'Bet') and now - at < timedelta(hours=6):
                      print(f"- {t.get('model')}: the same {t.get('action')} of {t.get('symbol')} was recorded twice within 2 minutes ({t['at']}).")
                  seen[k] = at
          except Exception as e:
              print(f'- could not check duplicates: {e}')
          PY
          fails=$(gh run list -R "$GITHUB_REPOSITORY" -w rivals.yml -L 6 --json status,conclusion --jq '[.[] | select(.status == "completed")][:3] | map(select(.conclusion == "failure")) | length' 2>/dev/null || echo 0)
          [ "$fails" = 3 ] && echo "- The Gemini and ChatGPT workflow failed its last 3 runs: https://github.com/$GITHUB_REPOSITORY/actions/workflows/rivals.yml" >> /tmp/alert.txt
          cat /tmp/alert.txt
          # Nov 18: an open alert issue no longer silences new alerts (the Oct 30 one blocked every alert after it):
          # open an issue, comment on a new problem or every 12 hours while one lasts, close after 2 quiet hours (ops/health_issue.py)
          python3 ops/health_issue.py /tmp/alert.txt || true
