name: Head to head (Gemini and ChatGPT)
on:
  schedule:
    # Same moments as Claude's runs (times in UTC; GitHub may start them a few minutes late)
    - cron: '13 * * * *'          # hourly, like Claude's hourly run
    - cron: '43 13-20 * * 1-5'    # half-hour runs during US market hours (EDT and EST)
    - cron: '35 13,14 * * 1-5'    # US open, 9:35 a.m. ET (EDT / EST)
    - cron: '5 20,21 * * 1-5'     # US close, 4:05 p.m. ET (EDT / EST)
    - cron: '35 1 * * 1-5'        # Shanghai open, 9:35 a.m. Beijing
    - cron: '5 7 * * 1-5'         # Shanghai close, 3:05 p.m. Beijing
    # Oct 28 event runs, matching Claude's extra runs (Bank of Canada, Fed, Microsoft/Alphabet earnings)
    - cron: '50 13 28 10 *'
    - cron: '5 18 28 10 *'
    - cron: '25 20 28 10 *'
    # (The 15-minute event watcher was removed on Oct 28 to save Actions minutes once the repo is private:
    #  Claude's extra event runs now dispatch this workflow themselves; the hourly :13 run is the fallback.)
    # Final scoring, Sat Nov 28 at 4:01 p.m. ET: freezes Gemini's and ChatGPT's final values (later runs only settle bets)
    - cron: '1 21 28 11 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = a normal check-in (skipped if one ran in the last 10 minutes); force = check in even so; prices = only test the price feeds; ask = feedback or review, no trading'
        default: run
        type: choice
        options: [run, force, prices, ask]
      name:
        description: 'ask mode only: name of the answers file in ops/review'
        default: answers
        required: false
      only:
        description: 'ask mode only: ask just these AIs (gemini, chatgpt); empty = both'
        default: ''
        required: false
permissions:
  contents: write
  pages: write
  issues: write
  actions: read
concurrency:
  group: rivals
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest data: a queued run must not start from the commit it was triggered on
      - name: Test price feeds
        if: ${{ inputs.mode == 'prices' }}
        run: python3 ops/rivals.py --prices
      - name: Ask Gemini and ChatGPT for feedback (no trading)
        if: ${{ inputs.mode == 'ask' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ASK_NAME: ${{ inputs.name }}
          ASK_ONLY: ${{ inputs.only }}
        continue-on-error: true
        run: python3 ops/ask_rivals.py
      - name: Save the answers (ops/review)
        if: ${{ inputs.mode == 'ask' }}
        run: |
          [ -d ops/review ] || exit 0
          mkdir -p /tmp/review && cp ops/review/*.json /tmp/review/ 2>/dev/null || exit 0
          git config user.name "paper-trades-bot"
          git config user.email "paper-trades-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p ops/review && cp /tmp/review/*.json ops/review/
            git add ops/review
            git diff --cached --quiet && exit 0
            git commit -qm "Ask Gemini and ChatGPT: answers saved in ops/review (no trading)"
            git push -q origin HEAD:main && break
            sleep $((i * 7))
          done
      - run: pip install -q matplotlib
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
      - name: Let each rival model decide and trade
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 ops/rivals.py
      - name: Check Claude's prices against the same feeds (ops/price_audit.py)
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
        continue-on-error: true
        timeout-minutes: 5
        run: python3 ops/price_audit.py
      - name: Publish
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f ops/src/rivals.json ] || exit 0
          # nothing to publish when this run skipped or changed nothing: never push an old copy over newer data
          if git diff --quiet -- ops/src/rivals.json && [ -z "$(git status --porcelain -- ops/src/price_audit.json)" ]; then echo "nothing changed; nothing to publish"; exit 0; fi
          cp ops/src/rivals.json /tmp/rivals.json
          [ -f ops/src/price_audit.json ] && cp ops/src/price_audit.json /tmp/price_audit.json
          [ -f ops/archive/thoughts.jsonl ] && cp ops/archive/thoughts.jsonl /tmp/thoughts.jsonl
          git config user.name "paper-trades-bot"
          git config user.email "paper-trades-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/rivals.json ops/src/rivals.json
            [ -f /tmp/price_audit.json ] && cp /tmp/price_audit.json ops/src/price_audit.json
            if [ -f /tmp/thoughts.jsonl ]; then mkdir -p ops/archive && cp /tmp/thoughts.jsonl ops/archive/thoughts.jsonl; fi
            python3 ops/build_site.py ops/src .
            git add ops/src/rivals.json index.html data.json data.ver audit.json og.png ops/src/og.json
            [ -f ops/src/price_audit.json ] && git add ops/src/price_audit.json
            [ -f ops/archive/thoughts.jsonl ] && git add ops/archive/thoughts.jsonl
            git diff --cached --quiet && exit 0
            git commit -qm "Head to head: hourly Gemini and ChatGPT run"
            if git push -q origin HEAD:main; then pushed=1; break; fi
            sleep $((i * 7))
          done
          [ "${pushed:-0}" = 1 ] || { echo "could not push after 5 tries"; exit 1; }
          gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null || true
      - name: Instagram (moments and the daily race post; does nothing until the key is set)
        if: ${{ inputs.mode != 'prices' && inputs.mode != 'ask' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: bash ops/social.sh
      - name: Health check (opens a GitHub issue, which emails the owner, when something keeps failing)
        if: ${{ always() && inputs.mode != 'prices' && inputs.mode != 'ask' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > /tmp/alert.txt
          python3 - >> /tmp/alert.txt <<'PY' || true
          import json
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          s = json.load(open('ops/src/rivals.json'))
          for mid, m in s.get('models', {}).items():
              if m.get('fail_streak', 0) >= 3:
                  print(f"- {m.get('label', mid)}: the last {m['fail_streak']} check-ins failed. Last error: {(m.get('last_run') or {}).get('status', '')}")
          end = datetime(2026, 11, 28, 21, 0, tzinfo=timezone.utc)
          try:
              h = json.load(open('ops/src/history.json'))
              last = max(datetime.fromisoformat(x['at'].replace('Z', '+00:00')) for x in h)
              if now < end and now - last > timedelta(hours=3):
                  print(f"- Claude: no update for {int((now - last).total_seconds() // 3600)} hours (last {last.isoformat()}). Its scheduled tasks may be paused or failing.")
          except Exception as e:
              print(f'- could not read Claude history: {e}')
          PY
          fails=$(gh run list -R "$GITHUB_REPOSITORY" -w rivals.yml -L 6 --json status,conclusion --jq '[.[] | select(.status == "completed")][:3] | map(select(.conclusion == "failure")) | length' 2>/dev/null || echo 0)
          [ "$fails" = 3 ] && echo "- The Gemini and ChatGPT workflow failed its last 3 runs: https://github.com/$GITHUB_REPOSITORY/actions/workflows/rivals.yml" >> /tmp/alert.txt
          [ -s /tmp/alert.txt ] || exit 0
          cat /tmp/alert.txt
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label health --json number --jq 'length' 2>/dev/null || echo 0)
          [ "$open" = "0" ] || { echo "a health issue is already open"; exit 0; }
          gh label create health -R "$GITHUB_REPOSITORY" --color B60205 --description "Automatic health alerts" >/dev/null 2>&1 || true
          printf '%s\n\n%s\n' "$(cat /tmp/alert.txt)" "Most likely causes: API credit ran out (OpenRouter for ChatGPT, Google billing for Gemini), a key expired, or Claude's scheduled tasks are paused. Fix it and the next run recovers on its own; close this issue when it is fixed." > /tmp/body.txt
          gh issue create -R "$GITHUB_REPOSITORY" --label health --title "Paper Trades needs attention" --body-file /tmp/body.txt || true
