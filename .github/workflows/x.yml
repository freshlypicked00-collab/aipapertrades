name: X (check the key, or send a test post)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = show which account the key belongs to (posts nothing); test = post one short test message; trailer = post the Season 1 trailer (from the media branch) once; video = post the video named in ops/x_video.json (from the media branch) once; delete = delete the posts listed in ops/x_delete.json'
        type: choice
        options: [check, test, trailer, note, video, delete]
        default: check
permissions:
  contents: write
concurrency:
  group: rivals
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check the key
        if: ${{ inputs.mode == 'check' }}
        run: |
          python3 ops/xpost.py check | tee /tmp/xcheck.txt
          echo "::notice title=X check::$(head -c 300 /tmp/xcheck.txt | tr '\n' ' ')"   # readable as an annotation without the full log
      - name: Test post
        if: ${{ inputs.mode == 'test' }}
        run: |
          python3 -c "import sys; sys.path.insert(0, 'ops'); import xpost; print('posted' if xpost.post('Three AIs. C\$100,000 each. Real prices. One month. Claude vs Gemini vs ChatGPT: every trade, live. 📈🤖', key='hello-v1') else 'not posted')"
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add ops/src/x_sent.json 2>/dev/null && git commit -qm "X: test post" && git push -q origin HEAD:main || true
      - name: Season 1 trailer (owner, Oct 30)
        if: ${{ inputs.mode == 'trailer' }}
        run: |
          git fetch -q --depth 1 origin media && git show origin/media:trailer-1080p.mp4 > /tmp/trailer.mp4 && ls -la /tmp/trailer.mp4
          python3 ops/x_trailer.py /tmp/trailer.mp4
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add ops/src/x_sent.json 2>/dev/null && git commit -qm "X: Season 1 trailer posted" && (git push -q origin HEAD:main || (git pull --rebase -q && git push -q origin HEAD:main)) || true
      - name: Delete our own posts listed in ops/x_delete.json (owner, Nov 2)
        if: ${{ inputs.mode == 'delete' }}
        run: |
          python3 -c "import json, sys; sys.path.insert(0, 'ops'); import xpost; print(json.dumps(xpost.delete(json.load(open('ops/x_delete.json'))['ids']), indent=1))"
      - name: One announcement (ops/x_note.json; owner, Oct 31)
        if: ${{ inputs.mode == 'note' }}
        run: |
          python3 -c "import json, sys; sys.path.insert(0, 'ops'); import xpost; n = json.load(open('ops/x_note.json')); ok = xpost.post(n['text'], photo=n.get('photo'), key=n['key'], reply_link=n.get('link')); print('::notice title=X note::' + ('posted' if ok else 'not posted'))"
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add ops/src/x_sent.json 2>/dev/null && git commit -qm "X: announcement posted" && (git push -q origin HEAD:main || (git pull --rebase -q && git push -q origin HEAD:main)) || true
      - name: One video post (ops/x_video.json, file from the media branch; owner, Oct 31)
        if: ${{ inputs.mode == 'video' }}
        run: |
          F=$(python3 -c "import json; print(json.load(open('ops/x_video.json'))['file'])")
          git fetch -q --depth 1 origin media && git show "origin/media:$F" > /tmp/video.mp4 && ls -la /tmp/video.mp4
          python3 -c "import json, sys; sys.path.insert(0, 'ops'); import xpost; n = json.load(open('ops/x_video.json')); ok = xpost.post_video(n['text'], '/tmp/video.mp4', n['key'], reply_link=n.get('link')); print('::notice title=X video::' + ('posted' if ok else 'not posted')); sys.exit(0 if ok else 1)"
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add ops/src/x_sent.json 2>/dev/null && git commit -qm "X: video posted" && (git push -q origin HEAD:main || (git pull --rebase -q && git push -q origin HEAD:main)) || true
