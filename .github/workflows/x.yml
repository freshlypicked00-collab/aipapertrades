name: X (check the key, or send a test post)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = show which account the key belongs to (posts nothing); test = post one short test message; trailer = post the Season 1 trailer (from the media branch) once'
        type: choice
        options: [check, test, trailer]
        default: check
permissions:
  contents: write
concurrency:
  group: rivals
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check the key
        if: ${{ inputs.mode == 'check' }}
        run: |
          python3 ops/xpost.py check | tee /tmp/xcheck.txt
          echo "::notice title=X check::$(head -c 300 /tmp/xcheck.txt | tr '\n' ' ')"   # readable as an annotation without the full log
      - name: Test post
        if: ${{ inputs.mode == 'test' }}
        run: |
          python3 -c "import sys; sys.path.insert(0, 'ops'); import xpost; print('posted' if xpost.post('Three AIs. C\$100,000 each. Real prices. One month. Claude vs Gemini vs ChatGPT: every trade, live. 📈🤖', key='hello-v1') else 'not posted')"
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add ops/src/x_sent.json 2>/dev/null && git commit -qm "X: test post" && git push -q origin HEAD:main || true
      - name: Season 1 trailer (owner, Oct 30)
        if: ${{ inputs.mode == 'trailer' }}
        run: |
          git fetch -q --depth 1 origin media && git show origin/media:trailer-1080p.mp4 > /tmp/trailer.mp4 && ls -la /tmp/trailer.mp4
          python3 ops/x_trailer.py /tmp/trailer.mp4
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add ops/src/x_sent.json 2>/dev/null && git commit -qm "X: Season 1 trailer posted" && (git push -q origin HEAD:main || (git pull --rebase -q && git push -q origin HEAD:main)) || true
