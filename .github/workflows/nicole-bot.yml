name: Nicole task bot (read taps, remind)
# No server: Telegram keeps the bot's unread updates for 24 hours, and this run reads them once an hour:
# Done taps, Nicole's messages (passed to the owner), linking, and one reminder for a job open over 4 hours.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: nicole-bot
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read the bot's inbox
        env:
          NICOLE_BOT_TOKEN: ${{ secrets.NICOLE_BOT_TOKEN }}
        run: |
          if [ -z "$NICOLE_BOT_TOKEN" ]; then echo "No NICOLE_BOT_TOKEN yet: nothing to do."; exit 0; fi
          python3 ops/nicole_bot.py poll
      - name: Save state (merged with any task send that saved meanwhile, so no Done tap or job is lost)
        run: |
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          python3 ops/nicole_bot.py save "Nicole bot: inbox read"
