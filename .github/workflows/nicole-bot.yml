name: Nicole task bot (read taps, remind)
# No server: Telegram keeps the bot's unread updates for 24 hours, and this run reads them once an hour:
# Done taps, Nicole's messages (passed to the owner), linking, and one reminder for a job open over 4 hours.
on:
  schedule:
    - cron: '41 * * * *'
  # real time (Nov 2): the Cloudflare Worker (ops/nicole/worker.js) passes each tap or message here the moment it happens
  repository_dispatch:
    types: [nicole_update]
  workflow_dispatch:
    inputs:
      webhook:
        description: 'turn real time on: the Cloudflare Worker address (https://....workers.dev), or "off" to go back to hourly'
        default: ''
        required: false
permissions:
  contents: write
concurrency:
  group: nicole-bot-${{ github.event_name == 'repository_dispatch' && github.run_id || 'poll' }}   # each real-time update runs on its own (a queued one must never be dropped); saves merge
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read the bot's inbox
        env:
          NICOLE_BOT_TOKEN: ${{ secrets.NICOLE_BOT_TOKEN }}
          NICOLE_UPDATE: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload.update) || '' }}
          WEBHOOK: ${{ inputs.webhook }}
        run: |
          if [ -z "$NICOLE_BOT_TOKEN" ]; then echo "No NICOLE_BOT_TOKEN yet: nothing to do."; exit 0; fi
          if [ -n "$WEBHOOK" ]; then python3 ops/nicole_bot.py webhook "$WEBHOOK"; fi
          python3 ops/nicole_bot.py poll
      - name: Save state (merged with any task send that saved meanwhile, so no Done tap or job is lost)
        run: |
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          python3 ops/nicole_bot.py save "Nicole bot: inbox read"
