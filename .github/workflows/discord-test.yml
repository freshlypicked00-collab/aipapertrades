name: Discord (test the connection)
# Posts one message to the Discord channel through DISCORD_WEBHOOK_URL, nothing else (no Telegram, no trading).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'which channel'
        type: choice
        options: [live-trades, daily-results, lead-changes]
        default: live-trades
      ping:
        description: 'mention an alert role'
        type: choice
        options: [none, leads, daily]
        default: none
      text:
        description: 'message to post'
        default: '📡 <b>Live feed connected.</b> Every trade, bet and result from Claude, Gemini and ChatGPT now posts here automatically. Live scoreboard: https://papertrades.ai'
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_DAILY: ${{ secrets.DISCORD_WEBHOOK_DAILY }}
          DISCORD_WEBHOOK_LEADS: ${{ secrets.DISCORD_WEBHOOK_LEADS }}
          CHANNEL: ${{ inputs.channel }}
          TEXT: ${{ inputs.text }}
          PING: ${{ inputs.ping }}
        run: |
          python3 -c "import os,sys; sys.path.insert(0,'ops'); import discord; u={'live-trades':discord.URL,'daily-results':discord.DAILY,'lead-changes':discord.LEADS}[os.environ['CHANNEL']]; u or sys.exit('::error::the secret for '+os.environ['CHANNEL']+' is not set'); ok=discord.post(os.environ['TEXT'],url=u,ping={'leads':discord.ROLE_LEADS,'daily':discord.ROLE_DAILY}.get(os.environ.get('PING'))); print('posted' if ok else 'FAILED'); sys.exit(0 if ok else 1)"
