name: Weekly stress drill (L3; all three AIs agreed Oct 31; never affects any score or trade)
on:
  schedule:
    - cron: '7 13 * * 1'    # Monday: open the drill (Claude answers in its next scheduled runs)
    - cron: '7 19 * * 1'    # Monday: ask Gemini and ChatGPT, then close answering
    - cron: '7 15 * * 3'    # Wednesday: anonymous grading
  workflow_dispatch:
    inputs:
      step:
        description: 'open | ask | grade'
        type: choice
        default: open
        options: [open, ask, grade]
permissions:
  contents: write
concurrency:
  group: rivals
  cancel-in-progress: false
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      ASK_FILE: ops/drill_question.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Which step
        id: s
        run: |
          S="${{ inputs.step }}"
          if [ -z "$S" ]; then case "${{ github.event.schedule }}" in '7 13 * * 1') S=open;; '7 19 * * 1') S=ask;; *) S=grade;; esac; fi
          echo "step=$S" >> "$GITHUB_OUTPUT"; echo "step: $S"
      - name: Open
        if: ${{ steps.s.outputs.step == 'open' }}
        run: python3 ops/drill.py open
      - name: Ask Gemini and ChatGPT, then close answering
        if: ${{ steps.s.outputs.step == 'ask' }}
        run: |
          N=$(python3 -c "import json; print(json.load(open('ops/src/drills.json'))[-1]['n'])")
          ASK_NAME=drill-$N python3 ops/ask_rivals.py || true
          python3 ops/drill.py collect ops/review/drill-$N.json
      - name: Grade
        if: ${{ steps.s.outputs.step == 'grade' }}
        run: |
          N=$(python3 -c "import json; print(json.load(open('ops/src/drills.json'))[-1]['n'])")
          python3 ops/drill.py grade_q
          ASK_NAME=drill-$N-grades python3 ops/ask_rivals.py || true
          python3 ops/drill.py grades ops/review/drill-$N-grades.json
      - name: Save
        run: |
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          mkdir -p /tmp/dr && cp ops/src/drills.json ops/drill_question.txt /tmp/dr/ 2>/dev/null; cp ops/review/drill-*.json /tmp/dr/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/dr/drills.json ops/src/drills.json; cp /tmp/dr/drill_question.txt ops/drill_question.txt 2>/dev/null || true; cp /tmp/dr/drill-*.json ops/review/ 2>/dev/null || true
            git add ops/src/drills.json ops/drill_question.txt ops/review/drill-*.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -qm "Weekly stress drill: ${{ steps.s.outputs.step }}" && git push -q origin HEAD:main && exit 0
            sleep $((i * 7))
          done
