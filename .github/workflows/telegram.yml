name: Post updates to Telegram
on:
  push:
    branches: [main]
    paths: ['ops/src/trades.json', 'ops/src/bets.json', 'ops/src/log.json', 'ops/src/take.json', 'ops/src/history.json', 'ops/src/ledger.json', 'ops/src/review.json', 'ops/src/report.json', 'ops/src/holdings.json', 'ops/src/events.json', 'ops/src/plans.json', 'ops/src/factcheck.json', 'ops/src/forecasts.json']
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = replay the latest trade; welcome = post and pin the welcome pack'
        default: test
        type: choice
        options: [test, welcome, editwelcome, announce, note, cleanup, poll]
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - run: pip install -q matplotlib
      - name: Post new trades, bets, takes and daily closes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.event.before }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test' && '1' || '' }}
          MODE: ${{ inputs.mode }}
        run: python3 ops/telegram.py
