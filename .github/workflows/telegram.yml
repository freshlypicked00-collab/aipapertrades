name: Post updates to Telegram
on:
  push:
    branches: [main]
    paths: ['ops/src/trades.json', 'ops/src/bets.json', 'ops/src/log.json', 'ops/src/take.json', 'ops/src/history.json', 'ops/src/ledger.json', 'ops/src/review.json', 'ops/src/report.json', 'ops/src/holdings.json', 'ops/src/events.json', 'ops/src/plans.json', 'ops/src/factcheck.json', 'ops/src/forecasts.json']
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = replay the latest trade; welcome = post and pin the welcome pack'
        default: test
        type: choice
        options: [test, welcome, editwelcome, announce, note, cleanup, poll]
permissions:
  contents: write   # only to save ops/src/x_sent.json after the daily X post (owner, Nov 2)
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - run: pip install -q matplotlib
      - name: Post new trades, bets, takes and daily closes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_DAILY: ${{ secrets.DISCORD_WEBHOOK_DAILY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BEFORE_SHA: ${{ github.event.before }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test' && '1' || '' }}
          MODE: ${{ inputs.mode }}
        run: python3 ops/telegram.py
      - name: Save the X post record (so the daily cap and no-repeat checks see it)
        if: always()
        run: |
          git diff --quiet -- ops/src/x_sent.json && exit 0
          git config user.name "paper-trades-bot"; git config user.email "paper-trades-bot@users.noreply.github.com"
          git add ops/src/x_sent.json; git commit -qm "X: daily race card posted" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
